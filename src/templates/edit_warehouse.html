{% extends "base.html" %}

{% block title %}Edit {{ warehouse.name }} - Warehouse Manager{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h1 class="card-title">Edit Warehouse</h1>
    
    <form method="POST">
        <div class="form-group">
            <label for="name">Warehouse Name</label>
            <input type="text" id="name" name="name" value="{{ warehouse.name }}" placeholder="Enter warehouse name" required>
        </div>
        
        <div class="form-group">
            <label>Capacity (read-only)</label>
            <input type="number" value="{{ warehouse.capacity_m3 }}" disabled style="opacity: 0.6;">
            <small style="color: var(--text-secondary); display: block; margin-top: 5px;">Capacity in m³ cannot be changed after creation</small>
        </div>
        
        <div class="form-group">
            <label>Items Stored</label>
            <input type="number" value="{{ warehouse.stored_items|length }}" disabled style="opacity: 0.6;">
            <small style="color: var(--text-secondary); display: block; margin-top: 5px;">Manage items from the warehouse view</small>
        </div>
        
        <div class="actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('view_warehouse', warehouse_id=warehouse.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
